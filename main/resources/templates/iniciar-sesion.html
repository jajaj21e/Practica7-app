<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Iniciar Sesión</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

    <!-- MENÚ DE NAVEGACIÓN -->
    <nav>
        <a class="logo" href="index.html">
            <img src="./imgs/nebula-03.svg" alt="Logo Nébula" width="100">
        </a>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="iniciar-sesion.html">Iniciar Sesión</a></li>
            <li><a href="registro.html">Registrarse</a></li>
        </ul>
    </nav>

    <main class="auth-container">
        <section class="auth-card">
            <h2>Iniciar Sesión</h2>
            <form class="auth-form" method="post" action="/autenticacion">
                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" required placeholder="tu@correo.com">
                </div>

                <div class="form-group">
                    <label for="contrasenia">Contraseña</label>
                    <input type="password" id="contrasenia" name="contrasenia" required placeholder="Ingresa tu contraseña">
                </div>

                <div class="form-buttons">
                    <button type="submit">Iniciar</button>
                    <button type="reset">Cancelar</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
