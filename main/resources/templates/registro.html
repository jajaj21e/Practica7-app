<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

    <!-- MENÚ DE NAVEGACIÓN -->
    <nav>
        <a class="logo" href="index.html">
            <img src="./imgs/nebula-03.svg" alt="Logo Nébula" width="100">
        </a>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="iniciar-sesion.html">Iniciar Sesión</a></li>
            <li><a href="registro.html">Registrarse</a></li>
        </ul>
    </nav>

    <main class="auth-container">
        <section class="auth-card">
            <h2>Registro de Usuario</h2>
            <form class="auth-form" method="post" action="/crear-cuenta">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" minlength="3" required placeholder="Escribe tu nombre completo">
                </div>

                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" required placeholder="tu@correo.com">
                </div>

                <div class="form-group">
                    <label for="contrasenia">Contraseña</label>
                    <input type="password" id="contrasenia" name="contrasenia" required placeholder="Crea una contraseña">
                </div>

                <div class="form-group">
                    <label for="txt_pseudonimo">Pseudónimo</label>
                    <input type="text" id="txt_pseudonimo" name="txt_pseudonimo" pattern="[a-zA-Z]{3,10}-[0-9]{2,10}" required placeholder="Nebula-2025">
                    <small class="help-text">Formato: 3 a 10 letras, guión y 2 a 10 números (ej. Rocker-123)</small>
                </div>

                <div class="form-group">
                    <label>Género</label>
                    <div class="radio-group">
                        <label><input type="radio" name="rad_genero" value="Femenino" required> Femenino</label>
                        <label><input type="radio" name="rad_genero" value="Masculino"> Masculino</label>
                        <label><input type="radio" name="rad_genero" value="Otro"> Otro</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="sel_suscripcion">Tipo de Suscripción</label>
                    <select id="sel_suscripcion" name="sel_suscripcion" required>
                        <option value="" disabled selected>Selecciona un plan</option>
                        <option value="Gratis">Gratis</option>
                        <option value="Mensual">Premium Mensual</option>
                        <option value="Anual">Premium Anual</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fechaNacimiento">Fecha de Nacimiento</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
                </div>

                <div class="form-group checkbox-group">
                    <label for="chk_terminos">
                        <input type="checkbox" id="chk_terminos" name="chk_terminos" required> Acepto los términos y condiciones
                    </label>
                </div>

                <div class="form-group">
                    <label for="comentarios">Comentarios</label>
                    <textarea id="comentarios" name="comentarios" rows="4" placeholder="Comentarios adicionales o gustos musicales..."></textarea>
                </div>

                <div class="form-buttons">
                    <button type="submit">Registrar</button>
                    <button type="reset">Restablecer</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
