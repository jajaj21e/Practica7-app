<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Grid Layout Example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .contenedor-basicp {
            display: grid;
            grid-template-columns: 100px 100px 100px;
            gap: 10px;
            border: 2px solid black;
            padding: 10px;
            background-color: #b6aeae;
            margin-bottom: 30px;

        }

        .caja-basica {
            height: 100px;
            background-color: #3811c5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .caja-basica:hover {
            background-color: #ff9900;
            transform: scale(1.05);
        }

        @media (max-width: 480px) {
            .contenedor-basicp {
                background-color: black;
                grid-template-columns: 100px 100px;

            }
        }

        @media (min-width: 768px) {
            .contenedor-basicp {
                background-color: black;
                grid-template-columns: 100px 100px 100px 100px;

            }
        }

        @media (480px <=width <=768px) {
            .contenedor-basicp {
                background-color: black;
                grid-template-columns: 100px 100px 100px;

            }
        }

        .parent {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4 100px);
            gap: 5px;
            max-width: 500px;
            border: 2px solid black;
            padding: 5px;
            background-color: rgb(224, 138, 138);
        }

        .parent div {
            border: 10px solid black;
            background-color: #ff9900;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        /*fila inico, coumna inico, fila fin, column fin*/
        .div1 {
            grid-area: 1 / 1 / 3 / 2;
        }

        .div2 {
            grid-area: 1 / 2 / 3 / 4;
        }

        .div3 {
            grid-area: 1 / 4 / 2 / 5;
        }
        .div4{
            grid-area: 2 / 4 / 3 / 5;
        }
        .div5{
            grid-area: 3 / 1 / 5 / 3;
        }
        .div6{
            grid-area: 3 / 3 / 4 / 5;
        }
        .div7{
            grid-area: 4 / 3 / 5 / 5;
        }
    </style>
</head>

<body>
    <div class="contenedor-basicp">
        <div class="caja-basica">1</div>
        <div class="caja-basica">2</div>
        <div class="caja-basica">3</div>
        <div class="caja-basica">4</div>
        <div class="caja-basica">5</div>
        <div class="caja-basica">6</div>
        <div class="caja-basica">7</div>
        <div class="caja-basica">8</div>
        <div class="caja-basica">9</div>
    </div>
    <div class="parent">
        <div class="div1">1</div>
        <div class="div2">2</div>
        <div class="div3">3</div>
        <div class="div4">4</div>
        <div class="div5">5</div>
        <div class="div6">6</div>
        <div class="div7">7</div>

    </div>
</body>

</html>
